<svg viewBox="0 0 1136 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The delivery loop as four moves: observe, orient, decide, act. Each move says what people do and what the harness does. A dashed line from Act back to Decide is where the harness stops for a person." font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b2d82"/>
    </marker>
    <marker id="arr-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f9b3c"/>
    </marker>
    <style>
      .box { fill: #faf8fc; stroke: #c9bedb; stroke-width: 2.5; }
      .move { font-size: 22px; font-weight: 700; fill: #5b2d82; }
      .who { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; font-family: ui-monospace, Menlo, Consolas, monospace; }
      .people { fill: #4f7a22; }
      .harness { fill: #655c70; }
      .line { font-size: 21px; fill: #241f2b; }
      .arrow { stroke: #5b2d82; stroke-width: 3; fill: none; }
      .stop { stroke: #6f9b3c; stroke-width: 3; fill: none; stroke-dasharray: 10 8; }
      .stoplbl { font-size: 17px; fill: #4f7a22; }
    </style>
  </defs>
  <rect x="0" y="0" width="1136" height="720" rx="18" fill="#ffffff"/>

  <!-- Observe -->
  <rect class="box" x="40" y="14" width="490" height="236" rx="14"/>
  <text class="move" x="70" y="50">Observe</text>
  <text class="who people" x="70" y="88">People</text>
  <text class="line" x="70" y="120">Sit with users. Contact is the act.</text>
  <text class="who harness" x="70" y="160">The harness</text>
  <text class="line" x="70" y="192">Telemetry, monitoring, errors, feedback,</text>
  <text class="line" x="70" y="226">gathered into the packet.</text>

  <path class="arrow" d="M532,132 L600,132" marker-end="url(#arr)"/>

  <!-- Orient -->
  <rect class="box" x="606" y="14" width="490" height="236" rx="14"/>
  <text class="move" x="636" y="50">Orient</text>
  <text class="who people" x="636" y="88">People</text>
  <text class="line" x="636" y="120">The shared operating picture,</text>
  <text class="line" x="636" y="154">the pitch, the shape.</text>
  <text class="who harness" x="636" y="190">The harness</text>
  <text class="line" x="636" y="222">The test suite, the standards file.</text>

  <path class="arrow" d="M851,252 L851,310" marker-end="url(#arr)"/>

  <!-- Decide -->
  <rect class="box" x="606" y="316" width="490" height="296" rx="14"/>
  <text class="move" x="636" y="352">Decide</text>
  <text class="who people" x="636" y="390">People</text>
  <text class="line" x="636" y="422">Rank the value queue. State the scenario.</text>
  <text class="line" x="636" y="456">Choose a prototype, or none.</text>
  <text class="line" x="636" y="490">Decide the shape, in conversation.</text>
  <text class="who harness" x="636" y="530">The harness</text>
  <text class="line" x="636" y="562">Enforces what a test or a standard settles.</text>
  <text class="line" x="636" y="596">It does not decide.</text>

  <path class="arrow" d="M604,464 L536,464" marker-end="url(#arr)"/>

  <!-- Act -->
  <rect class="box" x="40" y="316" width="490" height="296" rx="14"/>
  <text class="move" x="70" y="352">Act</text>
  <text class="who harness" x="70" y="390">The harness</text>
  <text class="line" x="70" y="422">Red first. Make it work, within the wall.</text>
  <text class="line" x="70" y="456">Make it right. Guard. Build, deploy, revert.</text>
  <text class="who people" x="70" y="496">People</text>
  <text class="line" x="70" y="528">Watch the first run. Accept and merge.</text>
  <text class="line" x="70" y="562">No second approver.</text>

  <path class="arrow" d="M285,314 L285,256" marker-end="url(#arr)"/>

  <!-- the harness stops for a person: dashed, from Act back to Decide -->
  <path class="stop" d="M285,614 L285,668 L851,668 L851,618" marker-end="url(#arr-dash)"/>
  <text class="stoplbl" x="568" y="700" text-anchor="middle">stops for a person: budget spent, a test or the picture changed, the shape or the pitch would change</text>
</svg>
