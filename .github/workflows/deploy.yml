# A push to master builds the site and deploys the Worker with wrangler.
# CLOUDFLARE_API_TOKEN is a repository secret: a token that can edit Workers
# in the Cloudflare account that holds the xtremevibing.com zone.
name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
